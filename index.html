<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flair wall</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
  @font-face {
    font-family: "Benzin";
    src: url("fonts/Benzin-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Benzin";
    src: url("fonts/Benzin-Medium.ttf") format("truetype");
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Benzin";
    src: url("fonts/Benzin-Semibold.ttf") format("truetype");
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Benzin";
    src: url("fonts/Benzin-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Benzin";
    src: url("fonts/Benzin-ExtraBold.ttf") format("truetype");
    font-weight: 800;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Pixelify Sans";
    src: url("fonts/PixelifySans-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Pixelify Sans";
    src: url("fonts/PixelifySans-SemiBold.ttf") format("truetype");
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --black: #050507;
    --white: #ffffff;
    --muted: #9a9a9e;
    --dim: #555558;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    min-height: 100%;
    background: var(--black);
    color: var(--white);
    font-family: "Benzin", -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 500;
    text-transform: lowercase;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* =========================================================================
     HIGH-CONTRAST DARK-GRAY BOTTOM HORIZON GRADIENT (SUBTLY ANIMATED)
     ========================================================================= */
  .ambient-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    background: #000000;
  }

  .bottom-gradient-arc {
    position: absolute;
    left: -12%;
    right: -12%;
    bottom: -10vh;
    height: 54vh;
    background:
      radial-gradient(
        ellipse 82% 72% at 50% 100%,
        rgba(138, 142, 150, 0.44) 0%,
        rgba(92, 95, 102, 0.28) 26%,
        rgba(34, 36, 40, 0.13) 48%,
        rgba(0, 0, 0, 0) 70%
      );
    transform-origin: center bottom;
    will-change: transform, opacity;
    animation: bottomArcBreathe 11s ease-in-out infinite alternate;
  }

  .bottom-gradient-edge {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 28vh;
    background: linear-gradient(
      to top,
      rgba(98, 101, 108, 0.34) 0%,
      rgba(48, 50, 55, 0.16) 28%,
      rgba(12, 13, 15, 0.04) 58%,
      rgba(0, 0, 0, 0) 100%
    );
    will-change: opacity, transform;
    animation: bottomEdgeBreathe 14s ease-in-out infinite alternate;
  }

  @keyframes bottomArcBreathe {
    0%   { transform: translate3d(-2%, 2%, 0) scaleX(0.96) scaleY(0.94); opacity: 0.88; }
    50%  { transform: translate3d(2%, -2%, 0) scaleX(1.04) scaleY(1.06); opacity: 1; }
    100% { transform: translate3d(-1%, 0%, 0) scaleX(1.0) scaleY(0.98); opacity: 0.92; }
  }

  @keyframes bottomEdgeBreathe {
    0%   { opacity: 0.82; transform: scaleY(0.95); }
    100% { opacity: 1; transform: scaleY(1.06); }
  }

  /* =========================================================================
     APP-STYLE PIXELATED BOOT SPLASH
     ========================================================================= */
  .boot-splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 1;
    filter: blur(0px);
    transition: opacity 380ms ease, filter 380ms ease;
  }

  .boot-splash.is-fading {
    opacity: 0;
    filter: blur(10px);
    pointer-events: none;
  }

  .boot-splash.is-done {
    display: none;
  }

  .boot-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .boot-logo-canvas {
    width: 101px;
    height: 101px;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .boot-percent {
    font-family: "Pixelify Sans", monospace;
    font-size: 27px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: #787878;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .boot-pixel-bar {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 3.5px;
    border: 1px solid #484848;
    background: #000000;
  }

  .boot-pixel-cell {
    width: 5.5px;
    height: 5.5px;
    background: #1c1c1c;
    flex-shrink: 0;
  }

  .boot-credit {
    position: absolute;
    bottom: 23px;
    left: 50%;
    transform: translateX(-50%);
    font-family: "Pixelify Sans", monospace;
    font-size: 11.25px;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: #5e5e5e;
    white-space: nowrap;
  }

  @keyframes blurIn {
    0% {
      opacity: 0;
      filter: blur(18px);
      transform: translateY(12px) scale(0.98);
    }
    55% {
      opacity: 0.92;
      filter: blur(3px);
    }
    100% {
      opacity: 1;
      filter: blur(0px);
      transform: translateY(0) scale(1);
    }
  }

  body.is-booting .reveal {
    opacity: 0;
    filter: blur(18px);
    transform: translateY(12px) scale(0.98);
    pointer-events: none;
  }

  body.is-revealed .reveal {
    animation: blurIn 680ms cubic-bezier(0.16, 1, 0.3, 1) var(--d, 0ms) both;
  }

  /* Small pixelated caption at the very top of the site */
  .top-tag {
    position: fixed;
    top: clamp(10px, 1.55dvh, 15px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    font-family: "Pixelify Sans", monospace;
    font-size: clamp(10.5px, 1.35dvh, 11.5px);
    font-weight: 400;
    letter-spacing: 0.09em;
    color: #8a8a8e;
    text-transform: lowercase;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 520ms ease 180ms;
  }

  body.is-revealed .top-tag {
    opacity: 1;
  }

  /* Centered 4-block vertical stage — fits 100% in first viewport at 100% zoom */
  .page {
    --icon-size: clamp(132px, 26.5dvh, 220px);
    --video-h: clamp(198px, 43.8dvh, 368px);
    position: relative;
    z-index: 2;
    min-height: 100dvh;
    width: 100%;
    padding: clamp(36px, 5.1dvh, 48px) 22px clamp(14px, 2.2dvh, 22px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2dvh, 18px);
  }

  /* 1. APP ICON (+30% larger, flat 2D with spatial ambient glow + mouse-driven 3D tilt) */
  .icon-stage {
    position: relative;
    width: var(--icon-size);
    height: calc(var(--icon-size) * 0.84);
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 760px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .icon-glow {
    position: absolute;
    top: calc(var(--icon-size) * -0.38);
    bottom: calc(var(--icon-size) * -0.38);
    left: calc(var(--icon-size) * -0.30);
    right: calc(var(--icon-size) * -0.30);
    border-radius: 50%;
    background: radial-gradient(
      circle at center,
      rgba(255, 255, 255, 0.22) 0%,
      rgba(205, 228, 255, 0.10) 34%,
      rgba(255, 255, 255, 0.025) 58%,
      rgba(0, 0, 0, 0) 74%
    );
    filter: blur(30px);
    opacity: 0.72;
    pointer-events: none;
    will-change: transform, opacity;
    transition: opacity 280ms ease;
  }

  .icon-stage.is-hover .icon-glow {
    opacity: 1;
  }

  .icon-tilt {
    position: relative;
    width: var(--icon-size);
    height: var(--icon-size);
    flex-shrink: 0;
    will-change: transform;
    transform-style: flat;
  }

  .icon-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    filter: drop-shadow(0 22px 42px rgba(0, 0, 0, 0.85));
  }

  .icon-sheen {
    position: absolute;
    inset: 10%;
    border-radius: 22.5%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 260ms ease;
    background: radial-gradient(
      circle at var(--sx, 50%) var(--sy, 50%),
      rgba(255, 255, 255, 0.34) 0%,
      rgba(255, 255, 255, 0.06) 40%,
      rgba(255, 255, 255, 0) 70%
    );
    mix-blend-mode: overlay;
  }

  .icon-stage.is-hover .icon-sheen {
    opacity: 1;
  }

  /* 2. COMPACT WIDE INFO BLOCK + 3D HOVER & PIXEL-ASSEMBLE TITLE */
  .info-block {
    width: 100%;
    max-width: 738px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(4px, 0.75dvh, 7px);
  }

  .title-stage {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: clamp(2px, 0.45dvh, 5px) 20px;
    perspective: 612px;
    cursor: pointer;
  }

  .title-glow {
    position: absolute;
    inset: -23px -40px;
    border-radius: 50%;
    background: radial-gradient(
      ellipse at center,
      rgba(255, 255, 255, 0.17) 0%,
      rgba(165, 224, 255, 0.08) 42%,
      rgba(0, 0, 0, 0) 74%
    );
    filter: blur(20px);
    opacity: 0.35;
    pointer-events: none;
    will-change: transform, opacity;
    transition: opacity 280ms ease;
  }

  .title-stage.is-hover .title-glow {
    opacity: 0.95;
  }

  .title-tilt {
    position: relative;
    display: inline-block;
    will-change: transform;
    transform-style: flat;
  }

  .title {
    font-size: clamp(22px, min(3.06vw, 3.8dvh), 32.5px);
    font-weight: 800;
    letter-spacing: 0.02em;
    line-height: 1.08;
    color: var(--white);
    transition: opacity 260ms ease, text-shadow 180ms ease;
    user-select: none;
  }

  .title.is-pixel-pending {
    opacity: 0;
  }

  .title-px-canvas {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 4;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .subtitle {
    font-size: clamp(11.5px, min(1.3vw, 1.65dvh), 13.5px);
    font-weight: 600;
    line-height: 1.38;
    color: #e6e6e6;
    max-width: 62ch;
  }

  /* 3. CENTERED 16:9 VIDEO BLOCK (+30% larger) + COMPACT RIGHT-ALIGNED PROGRESS BAR */
  .video-wrap {
    width: 100%;
    max-width: min(655px, 92vw, calc(var(--video-h) * 16 / 9));
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.35dvh, 12px);
  }

  .video-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0.75px solid rgba(255, 255, 255, 0.85);
    background: #060606;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
  }

  .video-frame video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 320ms ease;
    z-index: 2;
  }

  .video-frame.has-video video {
    opacity: 1;
  }

  .video-placeholder {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--dim);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    transition: opacity 280ms ease;
  }

  .video-frame.has-video .video-placeholder {
    opacity: 0;
    pointer-events: none;
  }

  /* Thin minimalist progress bar — 1/3 width, bottom-right under video */
  .video-progress {
    width: 33.333%;
    align-self: flex-end;
    height: 2px;
    background: rgba(255, 255, 255, 0.16);
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  .video-progress-fill {
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.9);
    transform-origin: left center;
    transform: scaleX(0);
    will-change: transform;
  }

  /* 4. SINGLE DOWNLOAD BUTTON + MAC ONLY NOTE */
  .cta-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(6px, 1.05dvh, 10px);
    margin-top: clamp(4px, 0.95dvh, 9px);
  }

  .btn-download {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    min-width: clamp(196px, 26dvh, 224px);
    height: clamp(40px, 5.4dvh, 47px);
    padding: 0 29px;
    background: var(--white);
    color: #000000;
    border: 1.35px solid var(--white);
    text-decoration: none;
    font-family: "Benzin", sans-serif;
    font-size: clamp(12.5px, 1.6dvh, 13.5px);
    font-weight: 800;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition:
      transform 180ms cubic-bezier(0.22, 1.35, 0.36, 1),
      background-color 150ms ease,
      color 150ms ease,
      filter 160ms ease;
  }

  .btn-download:hover {
    background: rgba(0, 0, 0, 0.72);
    color: var(--white);
    transform: translateY(-2px);
  }

  .btn-download:active {
    transform: scale(0.96);
    filter: blur(1.4px);
  }

  .mac-note {
    display: flex;
    align-items: center;
    gap: 5.5px;
    font-size: clamp(10px, 1.25dvh, 10.5px);
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  @media (max-width: 640px) {
    .page {
      --icon-size: clamp(124px, 23dvh, 170px);
      --video-h: clamp(160px, 34dvh, 240px);
      padding: 40px 16px 20px;
      gap: 14px;
    }
    .btn-download {
      width: 100%;
      min-width: 198px;
    }
  }
</style>
</head>
<body class="is-booting">

<!-- HIGH-CONTRAST DARK-GRAY BOTTOM HORIZON GRADIENT -->
<div class="ambient-bg" aria-hidden="true">
  <div class="bottom-gradient-arc"></div>
  <div class="bottom-gradient-edge"></div>
</div>

<!-- APP-STYLE PIXELATED LOADING SCREEN -->
<div class="boot-splash" id="bootSplash" aria-hidden="true">
  <div class="boot-center">
    <canvas class="boot-logo-canvas" id="bootLogoCanvas" width="28" height="28"></canvas>
    <div class="boot-percent" id="bootPercent">0%</div>
    <div class="boot-pixel-bar" id="bootPixelBar"></div>
  </div>
  <div class="boot-credit">only for flair workers</div>
</div>

<div class="top-tag">only for flair workers</div>

<main class="page">

  <!-- 1. APP ICON -->
  <div class="icon-stage reveal" id="iconStage" style="--d: 40ms">
    <div class="icon-glow" id="iconGlow" aria-hidden="true"></div>
    <div class="icon-tilt" id="iconTilt">
      <img class="icon-img" src="icon.png" alt="flair wall icon" draggable="false">
      <div class="icon-sheen" id="iconSheen" aria-hidden="true"></div>
    </div>
  </div>

  <!-- 2. COMPACT INFO -->
  <section class="info-block">
    <div class="title-stage" id="titleStage">
      <div class="title-glow" id="titleGlow" aria-hidden="true"></div>
      <div class="title-tilt" id="titleTilt">
        <h1 class="title is-pixel-pending" id="titleText">flair wall</h1>
        <canvas class="title-px-canvas" id="titlePxCanvas" aria-hidden="true"></canvas>
      </div>
    </div>
    <p class="subtitle reveal" style="--d: 280ms">шпалери для співробітників для гарного настрою</p>
  </section>

  <!-- 3. 16:9 VIDEO BLOCK + THIN SYNCHRONIZED PROGRESS BAR -->
  <section class="video-wrap reveal" style="--d: 360ms">
    <div class="video-frame" id="videoFrame">
      <video id="heroVideo" autoplay loop muted playsinline preload="auto">
        <source src="video.mp4" type="video/mp4">
      </video>
    </div>
    <div class="video-progress" id="videoProgress" aria-hidden="true">
      <div class="video-progress-fill" id="videoProgressFill"></div>
    </div>
  </section>

  <!-- 4. DOWNLOAD BUTTON + MAC ONLY -->
  <section class="cta-block reveal" style="--d: 460ms">
    <a
      class="btn-download"
      href="Flair-Wall-App.zip"
      download="Flair Wall App.zip"
    >
      <span>скачати</span>
    </a>
    <div class="mac-note">
      <svg width="10" height="12" viewBox="0 0 14 17" fill="none" aria-hidden="true">
        <path d="M11.67 8.95c-.02-1.88 1.54-2.79 1.61-2.83-.88-1.29-2.25-1.46-2.73-1.48-1.15-.12-2.27.69-2.86.69-.6 0-1.5-.67-2.48-.65-1.26.02-2.44.74-3.09 1.87-1.33 2.31-.34 5.71.94 7.58.63.92 1.38 1.94 2.37 1.9.96-.04 1.32-.61 2.48-.61 1.15 0 1.48.61 2.49.59 1.03-.02 1.68-.93 2.3-1.85.74-1.06 1.04-2.1 1.05-2.15-.02-.01-2.06-.79-2.08-3.06zM9.8 3.41c.52-.64.88-1.51.78-2.41-.76.03-1.7.51-2.24 1.14-.48.55-.91 1.46-.8 2.33.85.06 1.73-.43 2.26-1.06z" fill="#9A9A9E"/>
      </svg>
      <span>доступно тільки на mac</span>
    </div>
  </section>

</main>

<script>
(function () {
  "use strict";

  // =========================================================================
  // 0. APP-STYLE PIXELATED BOOT PRELOADER (EXACT 28x28 FLAIR PIXEL LOGO)
  // =========================================================================
  const bootSplash = document.getElementById("bootSplash");
  const bootLogoCanvas = document.getElementById("bootLogoCanvas");
  const bootLogoCtx = bootLogoCanvas ? bootLogoCanvas.getContext("2d") : null;
  const bootPercent = document.getElementById("bootPercent");
  const bootPixelBar = document.getElementById("bootPixelBar");

  const BAR_CELLS = 24;
  const barCells = [];
  if (bootPixelBar) {
    for (let i = 0; i < BAR_CELLS; i++) {
      const c = document.createElement("div");
      c.className = "boot-pixel-cell";
      bootPixelBar.appendChild(c);
      barCells.push(c);
    }
  }

  const LOGO_POLYS_NORM = [
    [[0.85802, 0.03197], [0.85802, 0.49543], [-0.00004, 0.99078], [-0.41982, 0.74844], [-0.41982, 0.28498], [-0.00004, 0.52733]],
    [[-0.40140, -0.75904], [-0.00003, -0.99076], [0.85802, -0.49536], [0.85802, -0.01061], [0.45665, 0.22111], [0.45665, -0.26364]],
    [[-0.45670, 0.72712], [-0.85807, 0.49540], [-0.85807, -0.49538], [-0.43826, -0.73773], [-0.03689, -0.50602], [-0.45670, -0.26365]]
  ];

  function pointInPoly(px, py, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1];
      const xj = poly[j][0], yj = poly[j][1];
      const intersect = ((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi + 1e-12) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  const GRID_N = 28;
  const logoPixels = [];
  for (let gy = GRID_N - 1; gy >= 0; gy--) {
    for (let gx = 0; gx < GRID_N; gx++) {
      const nx = ((gx + 0.5) / GRID_N) * 2.18 - 1.09;
      const ny = 1.09 - ((gy + 0.5) / GRID_N) * 2.18;
      if (
        pointInPoly(nx, ny, LOGO_POLYS_NORM[0]) ||
        pointInPoly(nx, ny, LOGO_POLYS_NORM[1]) ||
        pointInPoly(nx, ny, LOGO_POLYS_NORM[2])
      ) {
        const jitter = ((gx * 17 + gy * 31) % 7) * 0.08;
        logoPixels.push({ x: gx, y: gy, order: (GRID_N - 1 - gy) + jitter });
      }
    }
  }
  logoPixels.sort((a, b) => a.order - b.order);

  function updateBootVisuals(t) {
    const p = Math.max(0, Math.min(1, t));
    if (bootLogoCtx) {
      bootLogoCtx.clearRect(0, 0, GRID_N, GRID_N);
      const total = logoPixels.length;
      const filled = Math.round(p * total);
      const bright = Math.round(102 + p * 153);
      bootLogoCtx.fillStyle = "#1b1b1b";
      for (let i = filled; i < total; i++) {
        bootLogoCtx.fillRect(logoPixels[i].x, logoPixels[i].y, 1, 1);
      }
      bootLogoCtx.fillStyle = "rgb(" + bright + "," + bright + "," + bright + ")";
      for (let i = 0; i < filled; i++) {
        bootLogoCtx.fillRect(logoPixels[i].x, logoPixels[i].y, 1, 1);
      }
    }

    if (bootPercent) {
      bootPercent.textContent = Math.min(100, Math.round(p * 100)) + "%";
      const lum = Math.round(108 + p * 86);
      bootPercent.style.color = "rgb(" + lum + "," + lum + "," + lum + ")";
    }

    const filledCells = Math.round(p * BAR_CELLS);
    const bLum = Math.round(104 + p * 92);
    const col = "rgb(" + bLum + "," + bLum + "," + bLum + ")";
    for (let i = 0; i < barCells.length; i++) {
      barCells[i].style.background = i < filledCells ? col : "#1c1c1c";
    }
  }

  // =========================================================================
  // 1. LIGHT-PIXEL ASSEMBLY FOR "flair wall" TITLE ON FIRST REVEAL
  // =========================================================================
  const titleText = document.getElementById("titleText");
  const titlePxCanvas = document.getElementById("titlePxCanvas");

  function playTitlePixelMaterialize() {
    if (!titleText || !titlePxCanvas) return;
    const ctx = titlePxCanvas.getContext("2d");
    if (!ctx) {
      titleText.classList.remove("is-pixel-pending");
      return;
    }

    const rect = titleText.getBoundingClientRect();
    const padX = 36;
    const padY = 26;
    const w = Math.max(120, Math.ceil(rect.width) + padX * 2);
    const h = Math.max(40, Math.ceil(rect.height) + padY * 2);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    titlePxCanvas.style.width = w + "px";
    titlePxCanvas.style.height = h + "px";
    titlePxCanvas.width = Math.round(w * dpr);
    titlePxCanvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const off = document.createElement("canvas");
    off.width = w;
    off.height = h;
    const oCtx = off.getContext("2d");
    const cs = getComputedStyle(titleText);
    oCtx.clearRect(0, 0, w, h);
    oCtx.fillStyle = "#ffffff";
    oCtx.font = "800 " + cs.fontSize + ' "Benzin", -apple-system, sans-serif';
    oCtx.textAlign = "center";
    oCtx.textBaseline = "middle";
    oCtx.fillText("flair wall", w * 0.5, h * 0.5 + 1);

    const imgData = oCtx.getImageData(0, 0, w, h).data;
    const step = 3;
    const pts = [];

    for (let y = 0; y < h; y += step) {
      for (let x = 0; x < w; x += step) {
        const a = imgData[(y * w + x) * 4 + 3];
        if (a > 105) {
          const spreadAngle = Math.random() * Math.PI * 2;
          const spreadDist = 6 + Math.random() * 24;
          pts.push({
            tx: x,
            ty: y,
            sx: x + Math.cos(spreadAngle) * spreadDist,
            sy: y + Math.sin(spreadAngle) * spreadDist - 4,
            delay: (x / w) * 0.28 + Math.random() * 0.26,
            size: Math.random() < 0.72 ? 2 : 3,
            peakAlpha: 0.68 + Math.random() * 0.32
          });
        }
      }
    }

    if (pts.length === 0) {
      titleText.classList.remove("is-pixel-pending");
      return;
    }

    const totalMs = 960;
    const startTs = performance.now();
    let lastFrame = -1;
    let revealedReal = false;

    function tickTitle(now) {
      const elapsed = now - startTs;
      const p = Math.min(1, elapsed / totalMs);
      const frame = Math.floor(elapsed / 32);

      if (frame !== lastFrame || p >= 1) {
        lastFrame = frame;
        ctx.clearRect(0, 0, w, h);

        const fadeOut = p > 0.78 ? Math.max(0, 1 - (p - 0.78) / 0.22) : 1;
        if (p >= 0.74 && !revealedReal) {
          revealedReal = true;
          titleText.classList.remove("is-pixel-pending");
        }

        for (let i = 0; i < pts.length; i++) {
          const pt = pts[i];
          const local = Math.max(0, Math.min(1, (p - pt.delay) / 0.48));
          if (local <= 0) continue;

          const ease = 1 - Math.pow(1 - local, 3);
          const cx = pt.sx + (pt.tx - pt.sx) * ease;
          const cy = pt.sy + (pt.ty - pt.sy) * ease;
          const twinkle = local < 0.85 ? (0.45 + 0.55 * Math.sin(local * 14 + i)) : 1;
          const alpha = Math.min(1, local * 1.4) * pt.peakAlpha * twinkle * fadeOut;

          if (alpha > 0.03) {
            ctx.fillStyle = "rgba(255,255,255," + alpha.toFixed(3) + ")";
            ctx.fillRect(Math.round(cx), Math.round(cy), pt.size, pt.size);
          }
        }
      }

      if (p < 1) {
        requestAnimationFrame(tickTitle);
      } else {
        ctx.clearRect(0, 0, w, h);
        titleText.classList.remove("is-pixel-pending");
      }
    }

    requestAnimationFrame(tickTitle);
  }

  // =========================================================================
  // 2. VIDEO PLAYER + SMOOTH 60FPS SYNCHRONIZED TIMELINE PROGRESS BAR
  // =========================================================================
  const videoFrame = document.getElementById("videoFrame");
  const heroVideo = document.getElementById("heroVideo");
  const videoProgress = document.getElementById("videoProgress");
  const videoProgressFill = document.getElementById("videoProgressFill");

  if (heroVideo && videoFrame) {
    const revealVideo = () => {
      if (heroVideo.videoWidth > 0) videoFrame.classList.add("has-video");
    };
    heroVideo.addEventListener("loadeddata", revealVideo);
    heroVideo.addEventListener("playing", revealVideo);
    if (heroVideo.readyState >= 2) revealVideo();

    function syncProgressBar() {
      if (videoProgressFill && heroVideo.duration > 0 && isFinite(heroVideo.duration)) {
        const ratio = Math.max(0, Math.min(1, heroVideo.currentTime / heroVideo.duration));
        videoProgressFill.style.transform = "scaleX(" + ratio.toFixed(4) + ")";
      }
      requestAnimationFrame(syncProgressBar);
    }
    requestAnimationFrame(syncProgressBar);

    if (videoProgress) {
      videoProgress.addEventListener("click", (e) => {
        if (!heroVideo.duration || !isFinite(heroVideo.duration)) return;
        const r = videoProgress.getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
        heroVideo.currentTime = pct * heroVideo.duration;
      });
    }
  }

  function revealSiteAfterBoot() {
    if (bootSplash) {
      bootSplash.classList.add("is-fading");
      setTimeout(() => bootSplash.classList.add("is-done"), 400);
    }
    document.body.classList.remove("is-booting");
    document.body.classList.add("is-revealed");

    // Start video fresh right as the site reveals so progress bar starts cleanly from 0%
    if (heroVideo) {
      try {
        heroVideo.currentTime = 0;
        const playPromise = heroVideo.play();
        if (playPromise && playPromise.catch) playPromise.catch(() => {});
      } catch (_) {}
    }

    const startPixelTitle = () => setTimeout(playTitlePixelMaterialize, 140);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(startPixelTitle);
    } else {
      startPixelTitle();
    }
  }

  // Run 2.1s pixelated logo boot splash on first load
  if (bootSplash) {
    const bootDur = 2100;
    const bootStart = performance.now();
    let lastBootStep = -1;
    updateBootVisuals(0);

    function tickBoot(now) {
      const elapsed = now - bootStart;
      const t = Math.min(1, elapsed / bootDur);
      const stepIdx = Math.floor(elapsed / 42);
      if (stepIdx !== lastBootStep || t >= 1) {
        lastBootStep = stepIdx;
        updateBootVisuals(t);
      }
      if (t < 1) {
        requestAnimationFrame(tickBoot);
      } else {
        setTimeout(revealSiteAfterBoot, 220);
      }
    }
    requestAnimationFrame(tickBoot);
  } else {
    revealSiteAfterBoot();
  }

  // =========================================================================
  // 3. SHARED 3D PERSPECTIVE HOVER TILT + SPATIAL GLOW (ICON & "flair wall")
  // =========================================================================
  function attachSpatialTilt(opts) {
    const { stage, tiltEl, glowEl, sheenEl, textShadowEl, maxTilt, glowShift, hoverScale } = opts;
    if (!stage || !tiltEl) return;

    let targetRx = 0, targetRy = 0, targetScale = 1;
    let targetGx = 0, targetGy = 0;
    let curRx = 0, curRy = 0, curScale = 1;
    let curGx = 0, curGy = 0;
    let rafId = null;

    function animate() {
      const ease = 0.14;
      curRx += (targetRx - curRx) * ease;
      curRy += (targetRy - curRy) * ease;
      curScale += (targetScale - curScale) * ease;
      curGx += (targetGx - curGx) * ease;
      curGy += (targetGy - curGy) * ease;

      tiltEl.style.transform =
        "rotateX(" + curRx.toFixed(2) + "deg) rotateY(" + curRy.toFixed(2) + "deg) scale(" + curScale.toFixed(4) + ")";

      if (glowEl) {
        glowEl.style.transform =
          "translate3d(" + curGx.toFixed(1) + "px," + curGy.toFixed(1) + "px,0) scale(" + (0.98 + (curScale - 1) * 2.2).toFixed(3) + ")";
      }

      if (textShadowEl) {
        const sx = (-curRy * 0.22).toFixed(2);
        const sy = (curRx * 0.22).toFixed(2);
        const intensity = Math.min(1, (Math.abs(curRx) + Math.abs(curRy)) / maxTilt);
        if (intensity > 0.02) {
          textShadowEl.style.textShadow =
            sx + "px " + sy + "px 0px rgba(255,255,255," + (0.18 * intensity).toFixed(3) + "), " +
            (sx * 2.2).toFixed(2) + "px " + (sy * 2.2).toFixed(2) + "px 16px rgba(38,195,255," + (0.28 * intensity).toFixed(3) + ")";
        } else {
          textShadowEl.style.textShadow = "none";
        }
      }

      const settled =
        Math.abs(targetRx - curRx) < 0.03 &&
        Math.abs(targetRy - curRy) < 0.03 &&
        Math.abs(targetScale - curScale) < 0.0005 &&
        Math.abs(targetGx - curGx) < 0.1 &&
        Math.abs(targetGy - curGy) < 0.1;

      if (!settled) {
        rafId = requestAnimationFrame(animate);
      } else {
        rafId = null;
      }
    }

    function kick() {
      if (!rafId) rafId = requestAnimationFrame(animate);
    }

    stage.addEventListener("mouseenter", () => {
      stage.classList.add("is-hover");
      targetScale = hoverScale;
      kick();
    });

    stage.addEventListener("mousemove", (e) => {
      const r = stage.getBoundingClientRect();
      const nx = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width) * 2 - 1));
      const ny = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height) * 2 - 1));

      targetRy = nx * maxTilt;
      targetRx = -ny * maxTilt;
      targetGx = nx * glowShift;
      targetGy = ny * glowShift;

      if (sheenEl) {
        sheenEl.style.setProperty("--sx", ((nx * 0.5 + 0.5) * 100).toFixed(1) + "%");
        sheenEl.style.setProperty("--sy", ((ny * 0.5 + 0.5) * 100).toFixed(1) + "%");
      }
      kick();
    });

    stage.addEventListener("mouseleave", () => {
      stage.classList.remove("is-hover");
      targetRx = 0;
      targetRy = 0;
      targetScale = 1;
      targetGx = 0;
      targetGy = 0;
      kick();
    });
  }

  attachSpatialTilt({
    stage: document.getElementById("iconStage"),
    tiltEl: document.getElementById("iconTilt"),
    glowEl: document.getElementById("iconGlow"),
    sheenEl: document.getElementById("iconSheen"),
    maxTilt: 20,
    glowShift: 20,
    hoverScale: 1.05
  });

  attachSpatialTilt({
    stage: document.getElementById("titleStage"),
    tiltEl: document.getElementById("titleTilt"),
    glowEl: document.getElementById("titleGlow"),
    textShadowEl: titleText,
    maxTilt: 18,
    glowShift: 18,
    hoverScale: 1.055
  });
})();
</script>
</body>
</html>
